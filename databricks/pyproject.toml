[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zingyestates"
version = "0.1.0"
description = "ZingyEstates medallion transformations (bronze/silver/gold) for Azure Databricks"
requires-python = ">=3.10"
# pyspark and delta-spark are provided by the Databricks runtime; they are
# installed locally from requirements-dev.txt instead.
dependencies = ["datadog>=0.49"]

[project.scripts]
zingy-bronze = "zingyestates.cli:bronze_main"
zingy-silver = "zingyestates.cli:silver_main"
zingy-gold = "zingyestates.cli:gold_main"
zingy-local-run = "zingyestates.local_run:main"

[tool.setuptools.packages.find]
where = ["src"]
