# Orchestrated by ADF (adf/pipeline/pl_transform_databricks.json), which passes
# run_date. The job has no schedule of its own.
resources:
  jobs:
    zingy_daily_medallion:
      name: zingy-daily-medallion-${var.environment}
      max_concurrent_runs: 1
      timeout_seconds: 7200

      parameters:
        - name: run_date
          default: ""

      email_notifications:
        on_failure:
          - ${var.alert_email}

      tags:
        company: zingyestates
        env: ${var.environment}
        service: data-platform

      job_clusters:
        - job_cluster_key: medallion
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type}
            data_security_mode: SINGLE_USER
            autoscale:
              min_workers: 1
              max_workers: ${var.max_workers}
            spark_conf:
              spark.sql.session.timeZone: UTC
            spark_env_vars:
              DD_API_KEY: "{{secrets/${var.secret_scope}/datadog-api-key}}"
              DD_SITE: datadoghq.com
              ZINGY_STORAGE_ACCOUNT: ${var.storage_account}
            custom_tags:
              company: zingyestates
              env: ${var.environment}

      tasks:
        - task_key: bronze_ingestion
          job_cluster_key: medallion
          python_wheel_task:
            package_name: zingyestates
            entry_point: zingy-bronze
            parameters: ["--env", "${var.environment}", "--run-date", "{{job.parameters.run_date}}"]
          libraries:
            - whl: ../dist/*.whl

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: medallion
          python_wheel_task:
            package_name: zingyestates
            entry_point: zingy-silver
            parameters: ["--env", "${var.environment}", "--run-date", "{{job.parameters.run_date}}"]
          libraries:
            - whl: ../dist/*.whl

        - task_key: gold_modeling
          depends_on:
            - task_key: silver_transformation
          job_cluster_key: medallion
          python_wheel_task:
            package_name: zingyestates
            entry_point: zingy-gold
            parameters: ["--env", "${var.environment}", "--run-date", "{{job.parameters.run_date}}"]
          libraries:
            - whl: ../dist/*.whl
