name: Terraform outputs
description: >-
  Initialises terraform/ against an environment's remote state and exports every
  output as an upper-case environment variable (storage_account_name ->
  STORAGE_ACCOUNT_NAME) for later steps. Expects ARM_* OIDC variables on the job.

inputs:
  environment:
    description: dev, qa, uat or prod
    required: true
  terraform-version:
    description: Terraform version
    default: "1.9.8"

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Read outputs
      shell: bash
      run: |
        set -euo pipefail
        terraform -chdir=terraform init -input=false -backend-config=environments/${{ inputs.environment }}/backend.hcl >/dev/null
        terraform -chdir=terraform output -json \
          | jq -r 'to_entries[] | "\(.key | ascii_upcase)=\(.value.value)"' >> "$GITHUB_ENV"
