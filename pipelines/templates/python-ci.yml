# Ubuntu images ship Java 17, so the Spark/Delta tests run here as well.
steps:
- task: UsePythonVersion@0
  inputs: { versionSpec: $(pythonVersion) }

- script: |
    set -euo pipefail
    pip install --quiet -r requirements-dev.txt
    echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_HOME_17_X64"
  displayName: Install dependencies

- script: |
    set -euo pipefail
    ruff check .
    ruff format --check databricks tests
  displayName: Ruff lint and format check

- script: pytest --junitxml=$(Build.ArtifactStagingDirectory)/pytest.xml
  displayName: Unit and Spark tests

- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: JUnit
    testResultsFiles: $(Build.ArtifactStagingDirectory)/pytest.xml
    testRunTitle: Python

- script: python -m build --wheel --outdir $(Build.ArtifactStagingDirectory)/wheel databricks
  displayName: Build wheel

- publish: $(Build.ArtifactStagingDirectory)/wheel
  artifact: zingyestates-wheel
